<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AURA — Command Center</title>
<style>
  :root {
    --bg: #080b12;
    --bg-grid: rgba(56, 189, 248, 0.04);
    --surface: #0e141f;
    --surface-2: #131b29;
    --border: #1f2b3d;
    --border-bright: #2b3a52;
    --text: #e6edf6;
    --muted: #8394ab;
    --faint: #56657d;
    --accent: #22d3ee;
    --accent-dim: #0e7490;
    --good: #34d399;
    --warn: #fbbf24;
    --bad: #f87171;
    --radius: 14px;
    --shadow: 0 8px 30px rgba(0,0,0,0.45);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(34,211,238,0.06), transparent 60%),
      linear-gradient(var(--bg-grid) 1px, transparent 1px) 0 0 / 40px 40px,
      linear-gradient(90deg, var(--bg-grid) 1px, transparent 1px) 0 0 / 40px 40px,
      var(--bg);
    color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); }

  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 26px; border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, rgba(19,27,41,0.9), rgba(8,11,18,0.6));
    backdrop-filter: blur(6px);
    position: sticky; top: 0; z-index: 10;
  }
  .brand { display: flex; align-items: center; gap: 14px; }
  .logo {
    width: 40px; height: 40px; border-radius: 11px;
    background: radial-gradient(circle at 30% 30%, #22d3ee, #0e7490 70%);
    box-shadow: 0 0 22px rgba(34,211,238,0.5), inset 0 0 8px rgba(255,255,255,0.25);
    display: grid; place-items: center; font-weight: 800; color: #04222b;
    letter-spacing: 0.5px;
  }
  .brand h1 { font-size: 20px; margin: 0; letter-spacing: 4px; font-weight: 700; }
  .brand .sub { color: var(--muted); font-size: 12.5px; margin-top: 2px; letter-spacing: 0.3px; }
  .status { display: flex; align-items: center; gap: 18px; font-size: 12.5px; color: var(--muted); }
  .pill { display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px;
    border: 1px solid var(--border); border-radius: 999px; background: var(--surface); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
  .dot.on { background: var(--good); box-shadow: 0 0 10px var(--good); }
  .dot.off { background: var(--bad); box-shadow: 0 0 10px var(--bad); }

  main {
    display: grid; grid-template-columns: 1.15fr 1fr; gap: 20px;
    padding: 22px; max-width: 1320px; margin: 0 auto; align-items: start;
  }
  @media (max-width: 940px) { main { grid-template-columns: 1fr; } }

  .card {
    background: linear-gradient(180deg, var(--surface), var(--surface-2));
    border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); overflow: hidden;
  }
  .card + .card { margin-top: 20px; }
  .card > h2 {
    margin: 0; padding: 15px 18px; font-size: 13px; letter-spacing: 1.6px;
    text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  .card > h2 .count { color: var(--accent); font-weight: 700; letter-spacing: 0; }
  .card .body { padding: 16px 18px; }

  /* Chat */
  #chat { display: flex; flex-direction: column; height: calc(100vh - 148px); min-height: 460px; }
  #log { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: 86%; padding: 11px 14px; border-radius: 13px; white-space: pre-wrap; word-wrap: break-word; }
  .msg.user { align-self: flex-end; background: linear-gradient(180deg,#123b47,#0c2b34); border: 1px solid #17505f; }
  .msg.aura { align-self: flex-start; background: var(--surface-2); border: 1px solid var(--border); }
  .msg.error { align-self: flex-start; background: #2a1416; border: 1px solid #5c2327; color: #ffb4b4; }
  .msg .who { font-size: 10.5px; letter-spacing: 1px; text-transform: uppercase; color: var(--faint); margin-bottom: 5px; }

  .preview { margin-top: 10px; border: 1px solid var(--border-bright); border-radius: 11px; background: #0a0f18; overflow: hidden; }
  .preview .row { padding: 8px 12px; border-bottom: 1px solid var(--border); font-size: 13.5px; }
  .preview .row:last-of-type { border-bottom: none; }
  .preview .row .k { color: var(--faint); font-size: 11px; text-transform: uppercase; letter-spacing: 0.6px; display: block; margin-bottom: 2px; }
  .preview .actions { display: flex; gap: 10px; padding: 12px; background: #0c1320; }
  .btn { font: inherit; font-size: 13.5px; padding: 8px 16px; border-radius: 9px; border: 1px solid var(--border-bright);
    background: var(--surface-2); color: var(--text); cursor: pointer; transition: .15s; }
  .btn:hover { border-color: var(--accent-dim); }
  .btn.primary { background: linear-gradient(180deg,#22d3ee,#0e7490); border-color: #22d3ee; color: #04222b; font-weight: 700; }
  .btn.danger { color: #ffb4b4; border-color: #5c2327; background: #1c1113; }
  .btn.ghost { background: transparent; }
  .btn:disabled { opacity: .5; cursor: default; }

  .composer { display: flex; gap: 10px; padding: 14px; border-top: 1px solid var(--border); background: var(--surface); }
  .composer input { flex: 1; font: inherit; padding: 11px 14px; border-radius: 10px;
    border: 1px solid var(--border-bright); background: #0a0f18; color: var(--text); }
  .composer input:focus { outline: none; border-color: var(--accent-dim); box-shadow: 0 0 0 3px rgba(34,211,238,0.12); }

  /* Plans */
  .plan { border: 1px solid var(--border); border-radius: 12px; background: #0b111b; margin-bottom: 12px; }
  .plan:last-child { margin-bottom: 0; }
  .plan .head { display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; cursor: pointer; }
  .plan .goal { flex: 1; font-weight: 600; }
  .badge { font-size: 10.5px; letter-spacing: .8px; text-transform: uppercase; padding: 3px 8px; border-radius: 999px;
    border: 1px solid var(--border-bright); color: var(--muted); white-space: nowrap; }
  .badge.active { color: var(--accent); border-color: var(--accent-dim); }
  .badge.done { color: var(--good); border-color: #17513c; }
  .badge.abandoned { color: var(--faint); }
  .bar { height: 7px; border-radius: 999px; background: #0a1622; overflow: hidden; margin: 0 14px; }
  .bar > span { display: block; height: 100%; border-radius: 999px;
    background: linear-gradient(90deg, #0e7490, #22d3ee); transition: width .4s ease; }
  .plan .meta { display: flex; justify-content: space-between; padding: 8px 14px 12px; font-size: 12px; color: var(--muted); }
  .steps { padding: 0 14px 12px; display: none; }
  .steps.open { display: block; }
  .step { display: flex; gap: 9px; padding: 6px 0; font-size: 13.5px; border-top: 1px dashed var(--border); }
  .step .mark { width: 18px; text-align: center; flex-shrink: 0; }
  .step.done .txt { color: var(--muted); text-decoration: line-through; }
  .step .act { font-size: 10px; text-transform: uppercase; letter-spacing: .5px; color: var(--faint);
    border: 1px solid var(--border); border-radius: 5px; padding: 1px 5px; align-self: center; }
  .step .note { color: var(--faint); font-style: italic; }

  /* Memory */
  .fact { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-top: 1px solid var(--border); }
  .fact:first-child { border-top: none; }
  .fact .txt { flex: 1; }
  .conf { position: relative; width: 42px; height: 42px; flex-shrink: 0; }
  .conf svg { transform: rotate(-90deg); }
  .conf .val { position: absolute; inset: 0; display: grid; place-items: center; font-size: 11px; font-weight: 700; color: var(--accent); }
  .fact .ev { font-size: 11px; color: var(--faint); }

  /* Permissions */
  .seg { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 6px; }
  .seg button { padding: 10px 4px; border-radius: 9px; border: 1px solid var(--border-bright); background: #0a0f18;
    color: var(--muted); cursor: pointer; font: inherit; font-size: 12px; text-align: center; transition: .15s; }
  .seg button .lvl { display: block; font-size: 16px; font-weight: 800; color: var(--text); }
  .seg button.sel { border-color: var(--accent); background: linear-gradient(180deg, rgba(34,211,238,0.14), transparent); }
  .seg button.sel .lvl { color: var(--accent); }
  .perm-desc { margin-top: 12px; font-size: 13px; color: var(--muted); min-height: 20px; }

  .empty { color: var(--faint); font-size: 13.5px; text-align: center; padding: 22px 8px; }
  .row-actions { display: flex; gap: 8px; }
  .icon-btn { background: transparent; border: 1px solid var(--border); color: var(--faint); border-radius: 8px;
    width: 30px; height: 30px; cursor: pointer; font-size: 15px; line-height: 1; }
  .icon-btn:hover { color: var(--bad); border-color: #5c2327; }
  .toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
    background: var(--surface-2); border: 1px solid var(--border-bright); padding: 11px 18px; border-radius: 10px;
    box-shadow: var(--shadow); opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }
</style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="logo">A</div>
      <div>
        <h1>AURA</h1>
        <div class="sub" id="greeting">Command Center</div>
      </div>
    </div>
    <div class="status">
      <span class="pill"><span class="dot" id="dot-server"></span> <span id="server-label">connecting…</span></span>
      <span class="pill"><span class="dot" id="dot-groq"></span> model</span>
      <button class="btn ghost" id="btn-reset" title="Clear the conversation (keeps memory & plans)">Reset chat</button>
    </div>
  </header>

  <main>
    <!-- CHAT -->
    <section class="card" id="chat">
      <h2>Conversation <span class="count" id="user-tag"></span></h2>
      <div id="log"></div>
      <form class="composer" id="composer" autocomplete="off">
        <input id="input" placeholder="Give AURA a goal or a message…  e.g. “Help me find an AI internship”" />
        <button class="btn primary" id="send" type="submit">Send</button>
      </form>
    </section>

    <!-- RIGHT COLUMN -->
    <div>
      <section class="card">
        <h2>Active Plans <span class="count" id="plans-count"></span></h2>
        <div class="body" id="plans"><div class="empty">Loading…</div></div>
      </section>

      <section class="card">
        <h2>What AURA Remembers
          <span class="row-actions">
            <span class="count" id="mem-count"></span>
            <button class="btn ghost" id="btn-clear-mem" style="padding:4px 10px;font-size:11px;">Clear all</button>
          </span>
        </h2>
        <div class="body" id="memory"><div class="empty">Loading…</div></div>
      </section>

      <section class="card">
        <h2>Email Permission</h2>
        <div class="body">
          <div class="seg" id="perm">
            <button data-lvl="0"><span class="lvl">0</span>Off</button>
            <button data-lvl="1"><span class="lvl">1</span>Draft</button>
            <button data-lvl="2"><span class="lvl">2</span>Confirm</button>
            <button data-lvl="3"><span class="lvl">3</span>Auto</button>
            <button data-lvl="4"><span class="lvl">4</span>Full</button>
          </div>
          <div class="perm-desc" id="perm-desc"></div>
        </div>
      </section>
    </div>
  </main>

  <div class="toast" id="toast"></div>

<script>
const PERM_DESC = {
  0: "Disabled — AURA won't send email at all, and says why.",
  1: "Draft-only — AURA composes the email and shows it, but never sends.",
  2: "Confirm — AURA drafts, you approve each send with a card. (default)",
  3: "Auto-send — single emails go out immediately, then AURA tells you.",
  4: "Fully autonomous — sends without asking; reserved for future briefing mode.",
};

// Optional token for real (non-dev) deployments. In local dev mode the server
// ignores it. Set once via the console: localStorage.setItem('aura_token','...')
function authHeaders() {
  const h = { "Content-Type": "application/json" };
  const t = localStorage.getItem("aura_token");
  if (t) h["Authorization"] = "Bearer " + t;
  return h;
}
async function api(path, opts = {}) {
  const res = await fetch(path, { headers: authHeaders(), ...opts });
  let data = {};
  try { data = await res.json(); } catch (_) {}
  if (!res.ok) throw new Error(data.text || ("HTTP " + res.status));
  return data;
}
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove("show"), 2200);
}
const esc = (s) => (s || "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

/* ---------- greeting + health ---------- */
function setGreeting() {
  const h = new Date().getHours();
  const part = h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening";
  const t = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  document.getElementById("greeting").textContent = `${part}, Tiru · ${t}`;
}
async function loadHealth() {
  try {
    const h = await fetch("/api/health").then(r => r.json());
    document.getElementById("dot-server").className = "dot on";
    document.getElementById("server-label").textContent = h.dev_mode ? "dev mode" : "online";
    document.getElementById("dot-groq").className = "dot " + (h.groq_key_set ? "on" : "off");
    document.getElementById("user-tag").textContent = "";
  } catch {
    document.getElementById("dot-server").className = "dot off";
    document.getElementById("server-label").textContent = "offline";
  }
}

/* ---------- chat ---------- */
const log = document.getElementById("log");
function bubble(who, text, cls) {
  const d = document.createElement("div");
  d.className = "msg " + (cls || who);
  d.innerHTML = `<div class="who">${who === "user" ? "You" : who === "error" ? "Error" : "AURA"}</div>${esc(text)}`;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
  return d;
}
function confirmCard(parent, resp) {
  const p = resp.preview || {};
  const isBulk = resp.type === "confirm_bulk";
  const rows = isBulk
    ? `<div class="row"><span class="k">Recipients</span>${p.count} address${p.count === 1 ? "" : "es"}</div>
       <div class="row"><span class="k">Sample subject</span>${esc(p.sample_subject)}</div>
       <div class="row"><span class="k">Sample body</span>${esc((p.sample_body||"").slice(0,240))}</div>
       ${p.attachment ? `<div class="row"><span class="k">Attachment</span>${esc(p.attachment)}</div>` : ""}`
    : `<div class="row"><span class="k">To</span>${esc(p.to)}</div>
       <div class="row"><span class="k">Subject</span>${esc(p.subject)}</div>
       <div class="row"><span class="k">Body</span>${esc(p.body)}</div>
       ${p.attachment ? `<div class="row"><span class="k">Attachment</span>${esc(p.attachment)}</div>` : ""}`;
  const box = document.createElement("div");
  box.className = "preview";
  box.innerHTML = rows + `<div class="actions">
      <button class="btn primary">Send</button>
      <button class="btn ghost">Cancel</button></div>`;
  const [sendBtn, cancelBtn] = box.querySelectorAll("button");
  const finish = async (approved) => {
    sendBtn.disabled = cancelBtn.disabled = true;
    try {
      const r = await api("/api/confirm", { method: "POST",
        body: JSON.stringify({ pending_id: resp.pending_id, approved }) });
      bubble("aura", r.text || (approved ? "Done." : "Cancelled."));
    } catch (e) { bubble("error", e.message, "error"); }
    box.querySelector(".actions").remove();
    refreshPanels();
  };
  sendBtn.onclick = () => finish(true);
  cancelBtn.onclick = () => finish(false);
  parent.appendChild(box);
  log.scrollTop = log.scrollHeight;
}
async function send(text) {
  bubble("user", text);
  const thinking = bubble("aura", "…");
  try {
    const r = await api("/api/chat", { method: "POST", body: JSON.stringify({ message: text }) });
    thinking.remove();
    if (r.type === "confirm_email" || r.type === "confirm_bulk") {
      const b = bubble("aura", r.text || "Review before I send:");
      confirmCard(b, r);
    } else if (r.type === "error") {
      bubble("error", r.text, "error");
    } else {
      bubble("aura", r.text);
    }
  } catch (e) {
    thinking.remove();
    bubble("error", e.message, "error");
  }
  refreshPanels();
}
document.getElementById("composer").addEventListener("submit", (e) => {
  e.preventDefault();
  const inp = document.getElementById("input");
  const v = inp.value.trim();
  if (!v) return;
  inp.value = "";
  send(v);
});
document.getElementById("btn-reset").onclick = async () => {
  try { await api("/api/reset", { method: "POST" });
    log.innerHTML = ""; bubble("aura", "Fresh conversation. I still remember your facts and plans.");
    refreshPanels();
  } catch (e) { toast(e.message); }
};

/* ---------- plans ---------- */
async function loadPlans() {
  const el = document.getElementById("plans");
  try {
    const { plans } = await api("/api/plans");
    document.getElementById("plans-count").textContent = plans.length ? plans.length : "";
    if (!plans.length) { el.innerHTML = `<div class="empty">No plans yet. Give AURA a goal in the chat and it will build one.</div>`; return; }
    el.innerHTML = "";
    for (const p of plans) {
      const pct = p.progress.pct;
      const div = document.createElement("div");
      div.className = "plan";
      div.innerHTML = `
        <div class="head">
          <div class="goal">${esc(p.goal)}</div>
          <span class="badge ${p.status}">${p.status}</span>
        </div>
        <div class="bar"><span style="width:${pct}%"></span></div>
        <div class="meta">
          <span>${p.progress.done}/${p.progress.total} steps · ${pct}%</span>
          <span class="row-actions">
            <button class="icon-btn del" title="Delete plan">🗑</button>
          </span>
        </div>
        <div class="steps"></div>`;
      const head = div.querySelector(".head");
      const steps = div.querySelector(".steps");
      head.onclick = async () => {
        steps.classList.toggle("open");
        if (steps.classList.contains("open") && !steps.dataset.loaded) {
          const { plan } = await api("/api/plans/" + p.id);
          steps.innerHTML = plan.steps.map(s => `
            <div class="step ${s.status}">
              <span class="mark">${s.status === "done" ? "✓" : s.status === "skipped" ? "—" : "○"}</span>
              <span class="txt">${esc(s.description)} ${s.note ? `<span class="note">(${esc(s.note)})</span>` : ""}</span>
              <span class="act">${esc(s.action)}</span>
            </div>`).join("");
          steps.dataset.loaded = "1";
        }
      };
      div.querySelector(".del").onclick = async (e) => {
        e.stopPropagation();
        if (!confirm("Delete this plan and its steps?")) return;
        await api("/api/plans/" + p.id, { method: "DELETE" });
        toast("Plan deleted"); loadPlans();
      };
      el.appendChild(div);
    }
  } catch (e) { el.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}

/* ---------- memory ---------- */
function confRing(pct) {
  const r = 16, c = 2 * Math.PI * r, off = c * (1 - pct / 100);
  return `<div class="conf"><svg width="42" height="42">
    <circle cx="21" cy="21" r="${r}" fill="none" stroke="#12202e" stroke-width="4"/>
    <circle cx="21" cy="21" r="${r}" fill="none" stroke="#22d3ee" stroke-width="4"
      stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"/>
    </svg><span class="val">${pct}%</span></div>`;
}
async function loadMemory() {
  const el = document.getElementById("memory");
  try {
    const { memories } = await api("/api/memories");
    document.getElementById("mem-count").textContent = memories.length ? memories.length : "";
    if (!memories.length) { el.innerHTML = `<div class="empty">Nothing remembered yet. Tell AURA something worth keeping.</div>`; return; }
    el.innerHTML = "";
    for (const m of memories) {
      const pct = Math.round((m.confidence || 0) * 100);
      const row = document.createElement("div");
      row.className = "fact";
      row.innerHTML = `${confRing(pct)}
        <div class="txt">${esc(m.fact)}
          <div class="ev">confirmed ${m.evidence_count}×</div></div>
        <button class="icon-btn" title="Forget">🗑</button>`;
      row.querySelector("button").onclick = async () => {
        await api("/api/memories/" + m.id, { method: "DELETE" });
        toast("Forgotten"); loadMemory();
      };
      el.appendChild(row);
    }
  } catch (e) { el.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}
document.getElementById("btn-clear-mem").onclick = async () => {
  if (!confirm("Forget everything AURA remembers about you?")) return;
  try { await api("/api/memories", { method: "DELETE" }); toast("Memory cleared"); loadMemory(); }
  catch (e) { toast(e.message); }
};

/* ---------- permissions ---------- */
function paintPerm(level) {
  document.querySelectorAll("#perm button").forEach(b =>
    b.classList.toggle("sel", +b.dataset.lvl === level));
  document.getElementById("perm-desc").textContent = PERM_DESC[level] || "";
}
async function loadPerm() {
  try { const r = await api("/api/permissions"); paintPerm(r.send_email_level); }
  catch (e) { document.getElementById("perm-desc").textContent = e.message; }
}
document.querySelectorAll("#perm button").forEach(b => {
  b.onclick = async () => {
    const level = +b.dataset.lvl;
    paintPerm(level);
    try {
      const r = await api("/api/permissions", { method: "PUT",
        body: JSON.stringify({ send_email_level: level }) });
      paintPerm(r.send_email_level); toast("Permission set to level " + r.send_email_level);
    } catch (e) { toast(e.message); loadPerm(); }
  };
});

/* ---------- boot ---------- */
function refreshPanels() { loadPlans(); loadMemory(); loadPerm(); }
setGreeting(); setInterval(setGreeting, 30000);
loadHealth();
refreshPanels();
bubble("aura", "Command center online. Give me a goal — like “help me find an AI internship” — and I'll build a plan you can watch on the right.");
</script>
</body>
</html>
